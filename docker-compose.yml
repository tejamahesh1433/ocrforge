services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ocrforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ocrforge_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ocrforge}
    ports:
      - "5435:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ocrforge} -d ${POSTGRES_DB:-ocrforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ocrforge}:${POSTGRES_PASSWORD:-ocrforge_dev}@postgres:5432/${POSTGRES_DB:-ocrforge}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      HF_HOME: /models/huggingface
    ports:
      - "8001:8001"
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - huggingface-cache:/models/huggingface
    depends_on:
      postgres:
        condition: service_healthy
    gpus: all

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
  huggingface-cache:
