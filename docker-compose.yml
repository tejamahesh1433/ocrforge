services:
  postgres:
    image: postgres:16
    container_name: ocrforge-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ocrforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ocrforge_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ocrforge}

    ports:
      - "5435:5432"

    volumes:
      - ocrforge-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ocrforge} -d ${POSTGRES_DB:-ocrforge}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  ocrforge-postgres-data:
